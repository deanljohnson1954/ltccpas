<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 140" role="img" aria-labelledby="logoTitle logoDesc">
  <title id="logoTitle">HelpVet Net logo</title>
  <desc id="logoDesc">HelpVet Net logo with American flag icon, brand name, tagline, and LTC CPA positioning.</desc>
  <rect width="560" height="140" fill="none"/>
  <g transform="translate(8 12)">
    <rect width="120" height="96" rx="18" fill="#ffffff" stroke="#0f1e32" stroke-width="2"/>
    <rect width="70" height="46" rx="10" fill="#0f1e32"/>
    <g fill="#ffffff" transform="translate(8 8)">
      <circle cx="5" cy="5" r="3"/>
      <circle cx="20" cy="5" r="3"/>
      <circle cx="35" cy="5" r="3"/>
      <circle cx="10" cy="18" r="3"/>
      <circle cx="25" cy="18" r="3"/>
      <circle cx="5" cy="30" r="3"/>
      <circle cx="20" cy="30" r="3"/>
    </g>
    <rect y="46" width="120" height="16" fill="#b31b34"/>
    <rect y="62" width="120" height="16" fill="#ffffff"/>
    <rect y="78" width="120" height="16" fill="#b31b34"/>
    <rect y="94" width="120" height="16" fill="#ffffff"/>
  </g>
  <g transform="translate(150 24)">
    <text x="0" y="0" font-family="EB Garamond, Georgia, serif" font-size="40" font-weight="700" fill="#0f1e32">HelpVet Net</text>
    <text x="0" y="44" font-family="Source Sans 3, Arial, sans-serif" font-size="16" fill="#c8982a" letter-spacing="0.08em">Never Forget, Never Forgotten</text>
    <text x="0" y="70" font-family="Source Sans 3, Arial, sans-serif" font-size="13" fill="#1a2f4e" font-weight="600">Long Term Care (LTC) Insurance CPAs</text>
  </g>
</svg>
